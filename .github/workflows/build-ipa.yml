name: 构建 TravelBuddy IPA
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 安装 XcodeGen
        run: brew install xcodegen
      - name: 生成 Xcode 工程
        run: xcodegen generate
      - name: 静态检查与单元测试
        shell: bash
        run: |
          set +e
          xcodebuild test -project TravelBuddy.xcodeproj -scheme TravelBuddy -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E 'error:|fatal error:|Testing failed:|Unable to find a destination|XCTAssert' xcodebuild-test.log | tail -80 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"
      - name: 编译 iPhone Release App
        run: xcodebuild -project TravelBuddy.xcodeproj -scheme TravelBuddy -configuration Release -sdk iphoneos -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: 打包未签名 IPA
        run: |
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/TravelBuddy.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload TravelBuddy-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: TravelBuddy-unsigned-IPA
          path: TravelBuddy-unsigned.ipa
      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TravelBuddy-unsigned.ipa
          generate_release_notes: true

