name: TravelBuddy
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  TravelBuddy:
    type: application
    platform: iOS
    sources:
      - path: TravelBuddy
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TravelBuddy
        PRODUCT_NAME: TravelBuddy
        INFOPLIST_KEY_CFBundleDisplayName: 旅行计划
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 用于把你的旅行照片添加到行程和相册。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 用于保存你选择的旅行照片。
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 用于搜索地点并在地图上显示行程位置。
        INFOPLIST_KEY_UNSPLASH_ACCESS_KEY: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - TravelBuddyTests
  TravelBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources: TravelBuddyTests
    dependencies:
      - target: TravelBuddy

